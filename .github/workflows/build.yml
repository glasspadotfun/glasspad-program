name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/solana
            programs/curve/target
          key: sbf-${{ runner.os }}-${{ hashFiles('programs/curve/Cargo.lock') }}
          restore-keys: sbf-${{ runner.os }}-
      - name: install solana
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.1.21/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
      - name: versions
        run: solana --version && cargo-build-sbf --version && rustc --version && rustup toolchain list
      - name: build (mainnet)
        working-directory: programs/curve
        env:
          RUST_BACKTRACE: 1
        run: cargo build-sbf -- --locked && mkdir -p out && cp target/deploy/glasspad_curve.so out/glasspad_curve.mainnet.so
      - name: build (devnet)
        working-directory: programs/curve
        run: |
          cargo build-sbf -- --locked --features devnet 2>&1 | tee build-devnet.log
          ! grep -q 'Stack offset' build-devnet.log
          cp target/deploy/glasspad_curve.so out/glasspad_curve.devnet.so
      - name: anchor cli
        run: |
          curl -sSfL -o /usr/local/bin/anchor https://github.com/coral-xyz/anchor/releases/download/v0.31.1/anchor-0.31.1-x86_64-unknown-linux-gnu
          chmod +x /usr/local/bin/anchor && anchor --version
      - name: idl
        working-directory: programs/curve
        env:
          RUST_BACKTRACE: 1
        run: anchor idl build --skip-lint -o out/glasspad_curve.json -t out/glasspad_curve.ts && head -c 400 out/glasspad_curve.json
      - name: hashes
        working-directory: programs/curve
        run: ls -la out && sha256sum out/*.so
      - uses: actions/upload-artifact@v4
        with:
          name: curve-so
          path: programs/curve/out/*
