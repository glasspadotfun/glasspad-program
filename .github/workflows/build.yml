name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/solana
            programs/curve/target
          key: sbf-${{ runner.os }}-${{ hashFiles('programs/curve/Cargo.lock') }}
          restore-keys: sbf-${{ runner.os }}-
      - name: install solana
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.1.21/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
      - name: versions
        run: solana --version && cargo-build-sbf --version && rustc --version && rustup toolchain list
      - name: build
        working-directory: programs/curve
        env:
          RUST_BACKTRACE: 1
        run: cargo build-sbf -- --locked
      - name: hashes
        working-directory: programs/curve
        run: ls -la target/deploy && sha256sum target/deploy/*.so
      - uses: actions/upload-artifact@v4
        with:
          name: curve-so
          path: programs/curve/target/deploy/*.so
