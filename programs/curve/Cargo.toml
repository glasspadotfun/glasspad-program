[package]
name = "glasspad-curve"
version = "0.1.0"
edition = "2021"
publish = false
[lib]
crate-type = ["cdylib", "lib"]
[features]
default = []
devnet = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
no-entrypoint = []
cpi = ["no-entrypoint"]
no-idl = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []
[dependencies]
anchor-lang = {version = "=0.31.1", features = ["event-cpi", "init-if-needed", "allow-missing-optionals"]}
anchor-spl = { version = "=0.31.1", features = ["token_2022", "associated_token", "metadata"] }
[profile.release]
panic = "abort"
overflow-checks = true
lto = false
codegen-units = 1

[workspace]

# solana-verify picks its docker build image from this (solanafoundation/solana-verifiable-build:2.1.21,
# the same agave release build.yml installs). the identity build strips this table before staging.
[workspace.metadata.cli]
solana = "2.1.21"
